<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Tutor | PetCare</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="painel-header">
    <h1>PetCare</h1>
    <button onclick="sair()">Sair</button>
</header>

<main class="painel-container">

    <section>
        <h2>Olá, <span id="nomeUsuario"></span>!</h2>
        <p>Acompanhe as informações dos seus pets e as consultas agendadas.</p>
    </section>

    <section>
        <h2>Meus pets e consultas</h2>

        <div class="tabela-container">
            <table>
                <thead>
                    <tr>
                        <th>Pet</th>
                        <th>Espécie</th>
                        <th>Raça</th>
                        <th>Data da consulta</th>
                        <th>Veterinário</th>
                        <th>Motivo</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="listaPets"></tbody>
            </table>
        </div>

        <p id="mensagemPets"></p>
    </section>

</main>

<script>
async function carregarPainel() {
    const sessao = await fetch("../api/sessao.php");

    if (!sessao.ok) {
        window.location.href = "login.html";
        return;
    }

    const usuario = await sessao.json();

    if (usuario.tipo !== "tutor") {
        window.location.href = "login.html";
        return;
    }

    document.getElementById("nomeUsuario").textContent = usuario.nome;

    const resposta = await fetch("../api/painel-tutor.php");
    const pets = await resposta.json();

    const lista = document.getElementById("listaPets");
    const mensagem = document.getElementById("mensagemPets");

    lista.innerHTML = "";

    if (!resposta.ok) {
        mensagem.textContent = pets.erro || "Não foi possível carregar os pets.";
        return;
    }

    if (pets.length === 0) {
        mensagem.textContent = "Você ainda não possui pets cadastrados.";
        return;
    }

    pets.forEach(pet => {
        const linha = document.createElement("tr");

        [
            pet.animal,
            pet.especie,
            pet.raca,
            pet.data_consulta,
            pet.veterinario,
            pet.motivo,
            pet.status
        ].forEach(valor => {
            const coluna = document.createElement("td");
            coluna.textContent = valor ?? "Sem consulta";
            linha.appendChild(coluna);
        });

        lista.appendChild(linha);
    });
}

async function sair() {
    await fetch("../api/sessao.php", {
        method: "POST"
    });

    window.location.href = "login.html";
}

carregarPainel();
</script>

</body>
</html>
