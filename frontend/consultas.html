<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultas - PetCare</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">
        <img src="Imagens/logo.png" alt="Logo da Clínica Veterinária PetCare">
        <div>
            <h1>PetCare</h1>
            <p>Gerenciamento de consultas</p>
        </div>
    </div>
</header>

<nav>
    <a href="index.html">Início</a>
    <a href="tutores.html">Tutores</a>
    <a href="veterinarios.html">Veterinários</a>
    <a href="animais.html">Animais</a>
    <a href="consultas.html">Consultas</a>
</nav>

<main>
    <section>
        <h2>Cadastro de Consultas</h2>

        <form id="formConsulta">
            <input type="hidden" id="consultaId">

            <select id="consultaAnimal" required>
                <option value="">Selecione o animal</option>
            </select>

            <select id="consultaVeterinario" required>
                <option value="">Selecione o veterinário</option>
            </select>

            <input type="date" id="consultaData" required>
            <input type="text" id="consultaMotivo" placeholder="Motivo" required>

            <select id="consultaStatus" required>
                <option value="Agendada">Agendada</option>
                <option value="Realizada">Realizada</option>
                <option value="Cancelada">Cancelada</option>
            </select>

            <button type="submit">Salvar</button>
            <button type="button" onclick="limparConsulta()">Limpar</button>
        </form>
    </section>

    <section>
        <h2>Lista de Consultas</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Animal</th>
                    <th>Veterinário</th>
                    <th>Data</th>
                    <th>Motivo</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="listaConsultas"></tbody>
        </table>
    </section>
</main>

<footer>
    <h3>PetCare</h3>
    <p>Clínica Veterinária | Cuidado e carinho com seu pet.</p>
    <small>© 2026 PetCare - Todos os direitos reservados.</small>
</footer>

<script src="consultas.js"></script>
</body>
</html>
