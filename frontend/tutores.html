<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutores - PetCare</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🐾 PetCare</h1>
    <p>Gerenciamento de tutores</p>
</header>

<nav>
    <a href="index.html">Início</a>
    <a href="tutores.html">Tutores</a>
    <a href="veterinarios.html">Veterinários</a>
    <a href="animais.html">Animais</a>
    <a href="consultas.html">Consultas</a>
</nav>

<main>
    <section>
        <h2>Cadastro de Tutores</h2>

        <form id="formTutor">
            <input type="hidden" id="tutorId">

            <input type="text" id="tutorNome" placeholder="Nome" required>
            <input type="text" id="tutorTelefone" placeholder="Telefone" required>
            <input type="email" id="tutorEmail" placeholder="E-mail" required>

            <button type="submit">Salvar</button>
            <button type="button" onclick="limparTutor()">Limpar</button>
        </form>
    </section>

    <section>
        <h2>Lista de Tutores</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Telefone</th>
                    <th>E-mail</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="listaTutores"></tbody>
        </table>
    </section>
</main>

<footer>PetCare - Projeto Integrador</footer>

<script src="script.js"></script>
</body>
</html>
